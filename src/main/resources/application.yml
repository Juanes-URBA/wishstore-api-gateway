server:
  port: ${PORT:8080}

spring:
  application:
    name: wishstore-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products/**

            - id: wishlist-service
              uri: ${WISHLIST_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/wishlist/**

            - id: history-service
              uri: ${HISTORY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/history/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always