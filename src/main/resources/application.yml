server:
  port: 8080

spring:
  application:
    name: wishstore-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/products/**

            - id: wishlist-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/wishlist/**

            - id: history-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/history/**

management:
  endpoints:
    web:
      exposure:
        include: health,info